# =============================================================
# Tool 1 -- second LDO Nitehawk36 (identical hardware to T0)
# Klipper's second extruder MUST be named "extruder1".
# =============================================================

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NITEHAWK36_T1-if00   # <VERIFY>
restart_method: command

[extruder1]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
rotation_distance: 22.67
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk1:gpio9
sensor_type: PT1000
sensor_pin: nhk1:gpio29
pullup_resistor: 2200
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
max_extrude_cross_section: 5
control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96
pressure_advance: 0.035

[tmc2209 extruder1]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
uart_address: 0
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0

[multi_fan T1_partfan]
pin: nhk1:gpio6

[heater_fan T1_hotend_fan]
pin: nhk1:gpio5
tachometer_pin: ^nhk1:gpio16
tachometer_ppr: 2              # <VERIFY> per fan datasheet
tachometer_poll_interval: 0.0009
heater: extruder1
heater_temp: 50.0

[neopixel T1_leds]
pin: nhk1:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

# Second ADXL: useful for verifying T1 shaper matches T0.
[adxl345 T1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19s
