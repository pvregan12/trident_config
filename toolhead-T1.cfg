# =============================================================
# Tool 1 -- second LDO Nitehawk36 (identical hardware to T0)
# Klipper's second extruder MUST be named "extruder1".
# =============================================================

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NITEHAWK36_T1-if00   # <VERIFY>
restart_method: command

[extruder1]
step_pin: nhk1:gpio23         # verified
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
rotation_distance: 22.67       # calibrate
gear_ratio: 50:10              # <VERIFY> for extruder
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk1:gpio9      # verified
sensor_type: PT1000                # PT1000 RTD; Nitehawk36's 2.2k pullup is designed for this
sensor_pin: nhk1:gpio29     # verified
pullup_resistor: 2200       # Nitehawk36 fixed 2.2k pullup -- required for correct PT1000 readings
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
max_extrude_cross_section: 5
control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96
pressure_advance: 0.035

[tmc2209 extruder1]
uart_pin: nhk1:gpio0         # verified
tx_pin: nhk1:gpio1           # verified
uart_address: 0
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0

[multi_fan T1_partfan]
pin: nhk1:gpio6               # verified

[heater_fan T1_hotend_fan]
pin: nhk1:gpio5                # verified
tachometer_pin: ^nhk1:gpio16   # requires a 3-wire (tach) 2510 fan; verified
tachometer_ppr: 2              # pulses/rev almost surely 2
tachometer_poll_interval: 0.0009
heater: extruder
heater_temp: 50.0

[neopixel T1_leds]
pin: nhk1:gpio7             # verified
chain_count: 3
color_order: GRBW           # verified
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

# Second ADXL: useful for verifying T1 shaper matches T0.
[adxl345 T1]
cs_pin: nhk1:gpio27     # verified
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19

[resonance_tester]
accel_chip: adxl345 T1
probe_points: 150, 150, 20
