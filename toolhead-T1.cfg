# =============================================================
# Tool 1 -- second LDO Nitehawk36 (identical hardware to T0)
# Klipper's second extruder MUST be named "extruder1".
# =============================================================

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NITEHAWK36_T1-if00   # <VERIFY>
restart_method: command

[extruder1]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
rotation_distance: 22.67
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk1:gpio9
sensor_type: PT1000
sensor_pin: nhk1:gpio29
pullup_resistor: 2200
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
max_extrude_cross_section: 5
control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96
pressure_advance: 0.035

[tmc2209 extruder1]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
uart_address: 0
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0

# Part fan is fan_generic per r2pdx pattern: M106/M107 overrides in
# toolchanger_macros.cfg route to the active tool; _CHANGE_TOOL
# transfers fan speed between tools. (Phases 1-3 single-tool: rename
# this section to plain [fan] so stock M106 works, then revert.)
[fan_generic part_fan_t1]
pin: nhk1:gpio6
kick_start_time: 0.5
off_below: 0.10

[heater_fan T1_hotend_fan]
pin: nhk1:gpio5
tachometer_pin: ^nhk1:gpio16
tachometer_ppr: 2              # <VERIFY> per fan datasheet
tachometer_poll_interval: 0.0009
heater: extruder1
heater_temp: 50.0

[neopixel T1_leds]
pin: nhk1:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

# Second ADXL: useful for verifying T1 shaper matches T0.
[adxl345 T1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19

# ------------------- toolchanger sections for T1 -------------------
# Per official MadMax convention, per-head docking params live here.
# T1 = RIGHT dock (plus-X side) in the MadMax convention.

[gcode_macro T1]
variable_color: ""
variable_tool_number: 1
gcode:
  _CHANGE_TOOL T={tool_number}

[tool T1]
tool_number: 1
extruder: extruder1
gcode_x_offset: 0.0          # populated by Nudge/manual offset calibration
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: -1000     # <MEASURE> screws fully within dock slot; -1000 fails loudly if unset
params_detach_x: -1000   # <MEASURE> screws safely outside dock slot (park_x +/- ~4-5mm)
# per-tool input shaper (fill from SHAPER_CALIBRATE if T1/T1 differ):
#params_input_shaper_type_x: mzv
#params_input_shaper_freq_x: 0
#params_input_shaper_type_y: mzv
#params_input_shaper_freq_y: 0

[tool_probe T1]
pin: ^nhk1:gpio13            # Maxwell coupling contact via X-ENDSTOP port
                             # !! polarity ('!') unverified until Phase 5.3
tool: 1
z_offset: 0                  # Z homing is Cartographer's job; required field
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
