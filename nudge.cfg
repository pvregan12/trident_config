# =============================================================
# Nudge probe + automatic XYZ tool offset calibration
# -------------------------------------------------------------
# Two layers here:
#   1. [tools_calibrate] -- provided by viesturz/klipper-toolchanger
#      (tools_calibrate.py). Drives the nozzle against the Nudge
#      pin in Z, X, Y to find each tool's offset vs T0.
#   2. r2pdx's automation (joseph-greiner/
#      klipper_tc_automatic_offset_calibration): download his
#      offset_save_file.cfg and tc_offset_calibration_macros.cfg
#      into this config dir and include them below. They wrap
#      tools_calibrate into TC_FIND_ALL_TOOL_OFFSETS so it can
#      run automatically in PRINT_START, and persist offsets.
# =============================================================
# Hardware notes for this build:
# - Mount: Nudge ships Trident mounts; place it at the rear of the
#   bed, reachable by BOTH tools (mind dock keep-out and each
#   tool's reachable envelope with the other tool docked).
# - Wiring: Nudge is a normally-CLOSED contact (nozzle touch
#   breaks the circuit) -> no inversion on the pin. Wire it to a
#   spare endstop input on the MAIN board, not a Nitehawk --
#   it must be readable no matter which tool is attached.
# - Recommended: bump X/Y microsteps to 64 in printer.cfg for
#   finest calibration resolution (~0.003 mm/step w/ 20T pulleys).

[tools_calibrate]
pin: ^PC3                    # spare Z endstop input on main board verified
                             # Nudge = normally closed -> NO '!' inversion
spread: 3.0                  # X/Y clearance from center during probing;
                             # 3.5+ for 5mm pins
lower_z: 0.2                 # how far below pin top the nozzle sits for X/Y hits
travel_speed: 100
speed: 2.5
lift_speed: 4
final_lift_z: 4
sample_retract_dist: 2
samples: 3
samples_tolerance: 0.05
samples_result: median
trigger_to_bottom_z: 3       # calibrate: set 0, run TOOL_CALIBRATE_PROBE_OFFSET,
                             # subtract result from current probe offset
# probe: probe               # only for flipped-Nudge configs; leave commented

# ---------------- position + wrapper macros -------------------
# After mounting, jog the T0 nozzle to ~1mm above the pin center,
# GET_POSITION, and put those numbers here. TOOL_LOCATE_SENSOR
# finds the exact center on its own within 1-2mm.

[gcode_macro NUDGE_MOVE_OVER_PROBE]
gcode:
    G0 Z6 F1800
    G0 X150 F9000            # <MEASURE> pin location
    G0 Y290 F9000            # <MEASURE>

[gcode_macro NUDGE_FIND_TOOL_OFFSET]
# Baseline: locate the pin with T0 (T0 is always offset 0,0,0)
gcode:
    NUDGE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR

[gcode_macro NUDGE_FIND_TOOL_OFFSETS]
# Manual full-sequence version (r2pdx's TC_FIND_ALL_TOOL_OFFSETS
# supersedes this once his files are installed -- keep as fallback)
gcode:
    T0
    M109 T0 S150             # warm, not oozing: accounts for thermal growth
    NUDGE_FIND_TOOL_OFFSET
    M104 T0 S0
    {% for tool in [1] %}    # extend list for >2 tools
        T{tool}
        M109 T{tool} S150
        NUDGE_MOVE_OVER_PROBE
        TOOL_CALIBRATE_TOOL_OFFSET
        M104 T{tool} S0
    {% endfor %}

# ------------- r2pdx automation (install his files) ------------
# git clone or download from:
#   https://github.com/joseph-greiner/klipper_tc_automatic_offset_calibration
# then uncomment:
#[include offset_save_file.cfg]
#[include tc_offset_calibration_macros.cfg]
#
# His offset_save_file.cfg holds a variables block you extend per
# tool (t0_offset_x/y/z, t1_offset_x/y/z, nudge_position_*); the
# nudge_position_* values self-populate on first run. Probing
# temp (default 150C) is a variable at the top of
# TC_FIND_ALL_TOOL_OFFSETS. If run inside PRINT_START, tools stay
# at 150C for PRINT_START to take to print temp; if run standalone
# they cool down after. Offsets can be nudged live mid-print and
# are saved.
#
# IMPORTANT ordering: klipper-toolchanger's docs note the
# tools_calibrate include must come AFTER the probe section --
# keep this file's include line after cartographer.cfg in
# printer.cfg.
#
# Sanity check after install: type TOOL_ in the console;
# TOOL_LOCATE_SENSOR should autocomplete.
