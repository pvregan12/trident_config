# =============================================================
# Voron Trident 300 (LDO CUBE kit) + MadMax 2-tool toolchanger
# Main MCU: LDO Leviathan v1.2 (swap pin aliases if you have an
#           Octopus-based kit -- structure is identical)
# Toolheads: 2x LDO Nitehawk36 (USB)
# Z probe: Cartographer (survey/touch)
# XY homing: physical microswitches
# =============================================================
# This is a SKELETON / resource. Pins marked <VERIFY> must be
# checked against your kit's wiring guide before first power-up.

[include mainsail.cfg]
[include cartographer.cfg]
[include toolhead-T0.cfg]
[include macros.cfg]

# the following to be commented out for initial T0 only setup
[include toolchanger.cfg]
[include toolhead-T1.cfg]
[include nudge.cfg]          ; must come after the cartographer section if using flipped nudge (unusual)

# --------------------------- MCU -----------------------------
[mcu]
# ls /dev/serial/by-id/* after flashing
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_LEVIATHAN-if00  # <VERIFY>

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 6000            # start conservative with toolchanger mass; tune with input shaper
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

# ------------------------ A/B steppers ------------------------
# NOTE on travel limits: MadMax docks live at the FRONT of the
# gantry (front-facing X rail). With both tools mounted you lose
# some Y travel near the docks; position_min / dock keep-out is
# handled in toolchanger.cfg macros, but set position_max/endstop
# from your actual measured travel after the conversion.

[stepper_x]
step_pin: PB10              # Leviathan HV-STEPPER-0 verified 
dir_pin: !PB11
enable_pin: !PG0
#diag_pin: PG1 /unsure if need invert ! or not
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PC1            # X-ENDSTOP header, microswitch verified
position_min: 0
position_endstop: 300       # measure after MadMax carriage installed
position_max: 300
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PE15              # <VERIFY> this is HV_Stepper0 CS pin?
interpolate: false
run_current: 1.1            # LDO-42STH48-2504AC on CUBE kit <VERIFY current>
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PF15              # Leviathan HV-STEPPER-1 verified
dir_pin: !PF14
enable_pin: !PE9
#diag_pin: PE10 /unsure if need invert ! or not
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PC2            # Y-ENDSTOP, microswitch verified
position_min: 0
position_endstop: 300
position_max: 300           # you may need to reduce this / reserve dock zone
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PE11              # <VERIFY> this is HV_Stepper1 CS pin?
interpolate: false
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

# ------------------------- Z steppers -------------------------
# Trident: 3 independent Z with z_tilt. No Z endstop pin --
# Cartographer provides the virtual endstop.

[stepper_z]
step_pin: PD4               # front-left Stepper0 in Leviathan pinout verified
dir_pin: PD3
enable_pin: !PD7
#diag_pin: PD6 /unsure if need invert ! or not
rotation_distance: 4        # T8x4 leadscrew (LDO integrated leadscrew motors)
microsteps: 32
endstop_pin: probe:z_virtual_endstop   # Cartographer
position_max: 250
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0     # REQUIRED 0 for Cartographer touch homing

[tmc2209 stepper_z]
uart_pin: PD5               # this is Stepper0 UART in pinout verified
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PC12              # rear Stepper1 in pinout verified
dir_pin: PC11
enable_pin: !PD2
#diag_pin: PC1 /unsure if need invert ! or not
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD0               # this is Stepper1 UART in pinout verified
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PC9               # front-right Stepper2 in pinout verified
dir_pin: PC8
enable_pin: !PC10
#diag_pin: PA15 /unsure if need invert ! or not
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PA8               # this is Stepper2 UART in pinout verified
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

[z_tilt]
# Trident 300 standard points
z_positions:
    -50, 18
    150, 348
    350, 18
points:
    30, 5
    150, 245
    270, 5
speed: 200
horizontal_move_z: 5       # safe with Cartographer scan; probe never touches
retries: 5
retry_tolerance: 0.0075

# --------------------------- Bed ------------------------------
[heater_bed]
heater_pin: PG11            # SSR output verified
sensor_type: Generic 3950
sensor_pin: PA1             # TH0 verified
max_power: 0.8              # keep <=0.8 for LDO 300 keenovo-style pad
min_temp: 0
max_temp: 120
control: pid
pid_kp: 40
pid_ki: 1.5
pid_kd: 400                 # run PID_CALIBRATE

# ------------------------ Misc / chamber -----------------------
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA2             # TH1 verified

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor leviathan]
sensor_type: temperature_mcu

[controller_fan electronics_fan]
pin: PB7
#tachometer_pin: PB8        # if this fan has a tach — note the full
#tachometer_ppr: 2          # parameter name; 'tacho' won't parse

[exhaust_fan]
# optional; or [fan_generic exhaust]
pin: PB3                    # Fan1 verified

[idle_timeout]
timeout: 1800
gcode:
    # Park active tool safely; don't power off with a tool docked mid-change
    TURN_OFF_HEATERS
    M84

# Filament runout: one switch per tool (optional)
#[filament_switch_sensor runout_T0]
#switch_pin: ^nhk0:gpio3    # Nitehawk FS pin verified
# filament sensor pin on Leviathan is PC0
#pause_on_runout: true

[exclude_object]
[respond]
[save_variables]
filename: ~/printer_data/config/variables.cfg   # toolchanger offsets persist here

[force_move]
enable_force_move: true     # handy while commissioning docks

# SAVE_CONFIG section will be appended by Klipper below
