# =============================================================
# Macros -- homing, print start/end, calibration helpers
# =============================================================

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    # Never home Z through the dock zone; move to bed center first.
    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}
    {% if home_all or 'Z' in params %}
        G90
        G0 X150 Y150 F12000        ; Cartographer touch at bed center
        G28 Z
        G0 Z10 F1800
    {% endif %}

[gcode_macro PRINT_START]
# Slicer: PRINT_START BED=... T0_TEMP=... T1_TEMP=... TOOLS_USED=...
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set t0 = params.T0_TEMP|default(0)|float %}
    {% set t1 = params.T1_TEMP|default(0)|float %}
    M140 S{bed}
    G28
    Z_TILT_ADJUST
    G28 Z                          ; re-home Z after tilt
    M190 S{bed}
    BED_MESH_CALIBRATE ADAPTIVE=1  ; Cartographer scan mesh
    # Preheat only the tools this print uses
    {% if t0 > 0 %} M104 T0 S{t0} {% endif %}
    {% if t1 > 0 %} M104 T1 S{t1} {% endif %}
    T0                             ; start with tool 0 (or slicer's initial tool)
    {% if t0 > 0 %} M109 T0 S{t0} {% endif %}
    # Automatic XYZ offset calibration (Nudge + r2pdx macros).
    # Uncomment once installed & commissioned; skips are fine for
    # single-tool prints -- gate on TOOLS_USED if desired:
    # TC_FIND_ALL_TOOL_OFFSETS
    LINE_PURGE                     ; or your purge/prime of choice

[gcode_macro PRINT_END]
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G0 Z10 F1800
    G90
    # Park active tool in its dock so the gantry is clear (optional):
    # DROPOFF_TOOL
    G0 X150 Y250 F12000
    M84

[gcode_macro TC_TEST_CYCLE]
# Commissioning helper: run N pick/drop cycles and count failures
gcode:
    {% set n = params.COUNT|default(10)|int %}
    {% for i in range(n) %}
        T0
        G4 P500
        T1
        G4 P500
    {% endfor %}
    T0
    RESPOND MSG="Toolchange cycle test complete"

# M106/M107 fan mapping to active tool is provided by
# klipper-toolchanger's included macros -- don't redefine here.
