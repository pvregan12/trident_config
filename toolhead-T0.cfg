# =============================================================
# Tool 0 -- LDO Nitehawk36 (USB toolhead board, RP2040)
# Flash Katapult+Klipper per LDO docs; each board gets a unique
# /dev/serial/by-id path. LABEL YOUR BOARDS/CABLES T0 vs T1.
# =============================================================

[mcu nhk0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NITEHAWK36_T0-if00   # <VERIFY>
restart_method: command

[extruder]
step_pin: nhk0:gpio23
dir_pin: nhk0:gpio24
enable_pin: !nhk0:gpio25
rotation_distance: 22.67    # calibrate; example for CW2/Galileo-style
gear_ratio: 50:10           # <VERIFY for your extruder>
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk0:gpio9
sensor_type: PT1000                # PT1000 RTD; Nitehawk36's 2.2k pullup is designed for this
sensor_pin: nhk0:gpio29
pullup_resistor: 2200       # Nitehawk36 fixed 2.2k pullup -- required for correct PT1000 readings
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
max_extrude_cross_section: 5   # toolchanger purge lines
control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96                  # run PID_CALIBRATE per tool
pressure_advance: 0.035     # tune per tool/nozzle

[tmc2209 extruder]
uart_pin: nhk0:gpio0
tx_pin: nhk0:gpio1
uart_address: 0
interpolate: false
run_current: 0.6            # <VERIFY for your extruder motor>
sense_resistor: 0.100
stealthchop_threshold: 0

# Part cooling fan -- named per-tool; klipper-toolchanger's
# [multi_fan]/fan switching maps M106 to the active tool.
[multi_fan T0_partfan]
pin: nhk0:gpio6

[heater_fan T0_hotend_fan]
pin: nhk0:gpio5
tachometer_pin: ^nhk0:gpio16   # requires a 3-wire (tach) 2510 fan;
tachometer_ppr: 2              # <VERIFY> pulses/rev from fan datasheet (2 is typical)
tachometer_poll_interval: 0.0009
heater: extruder
heater_temp: 50.0

# Toolhead LEDs (Nitehawk NEOPIXEL header)
[neopixel T0_leds]
pin: nhk0:gpio7
chain_count: 3
color_order: GRBW           # <VERIFY LED type>
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

# Accelerometer for input shaper (Nitehawk36 onboard ADXL345)
[adxl345 T0]
cs_pin: nhk0:gpio27
spi_software_sclk_pin: nhk0:gpio18
spi_software_mosi_pin: nhk0:gpio20
spi_software_miso_pin: nhk0:gpio19

[resonance_tester]
accel_chip: adxl345 T0
probe_points: 150, 150, 20
