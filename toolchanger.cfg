# =============================================================
# MadMax toolchanger -- viesturz/klipper-toolchanger
# Install first:
#   cd ~ && git clone https://github.com/viesturz/klipper-toolchanger
#   ./klipper-toolchanger/install.sh
# Then also include the project's provided macro files:
#   [include toolchanger-macros.cfg] etc. per its README.
# MadMax's repo ships sample configs in /Configs -- diff against
# those; the coordinates below are PLACEHOLDERS to be measured.
# =============================================================

[toolchanger]
t_command_restore_axis: XYZ
params_safe_y: 120           # <MEASURE> Y clear of docks with tool attached
params_close_y: 30           # <MEASURE> approach line
params_fast_speed: 15000     # mm/min travel between docks
params_path_speed: 900       # mm/min through the dock path -- slow & smooth
uses_axis: xyz
on_axis_not_homed: home
# Tool presence is detected via the Maxwell coupling contact pins:
# when the head seats, the pin circuit closes. Wire per MadMax docs.
params_type: 'mag'           # MadMax = magnetic, XY-only path (no lift)
# Dock path: MadMax is a pure-XY changer. Typical path: move to
# safe Y at dock X -> push in (Y-) to seat/unseat -> slide X along
# keyslot -> back out. Take exact params_dropoff_path /
# params_pickup_path from the MadMax sample configs and tune.

[tool T0]
tool_number: 0
extruder: extruder
fan: multi_fan T0_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 40.0          # <MEASURE> T0 dock position
params_park_y: 300.0
params_park_z: 0             # unused for XY-only change; kept for macro compat
# Maxwell coupling detect: Nitehawk X-ENDSTOP port (JST-PH 2P,
# gpio13 + GND) -- free on this build since XY homing switches live
# on the main board.
# !! POLARITY UNVERIFIED: whether this needs a '!' depends on the
# coupling contact behavior AND your pinned klipper-toolchanger
# version (2026 polarity flip). Commissioning Phase 5.3 verifies
# this BEFORE any dock motion -- wrong polarity works silently
# backwards rather than erroring.
detect_pin: ^nhk0:gpio13

[tool T1]
tool_number: 1
extruder: extruder1
fan: multi_fan T1_partfan
# These offsets come from calibration (Nudge or manual):
gcode_x_offset: 0.0          # will be nonzero after calibration
gcode_y_offset: 0.0
gcode_z_offset: 0.0
params_park_x: 260.0         # <MEASURE> T1 dock position
params_park_y: 300.0
params_park_z: 0
detect_pin: ^nhk1:gpio13    # T1 X-ENDSTOP port; same polarity caveat as T0

# Crash/attach safety: klipper-toolchanger can verify the detect
# pin state after every pickup/dropoff and SHUTDOWN on mismatch.
# MadMax relies on this since there's no positive lock -- enable it.

[tool_probe_endstop]
# Only needed if you use MadMax's coupling-as-probe instead of /
# alongside Cartographer. With Cartographer handling Z, you can
# omit this, but it's a nice cross-check and enables per-tool
# Z offset probing on a Nudge-style pin.
crash_mintime: 0.5
crash_gcode:
    RESPOND TYPE=error MSG='Tool crash or detach detected!'
    M112
