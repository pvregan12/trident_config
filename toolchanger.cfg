# =============================================================
# MadMax toolchanger -- viesturz/klipper-toolchanger
# Structure mirrors the real MadMax sample config
# (Configs/r2pdx_config-micron-2025-12-21) rather than invented
# param names. All Y/X positions are <MEASURE> placeholders for a
# Trident 300 -- r2pdx's numbers are for a Micron and WILL differ.
# =============================================================

[toolchanger]
t_command_restore_axis: XYZ
# Z required: the paths below include a 1mm Z hop.

# --- MadMax dock geometry, four named Y lines + two X per tool ---
params_safe_toolhead_y: -1000 # <MEASURE> active tool clears docked tools; -1000 fails loudly
params_safe_shuttle_y: -1000  # <MEASURE> bare carriage clears docked tools + magnets
                              # tools without magnets pulling on them
params_close_y: -1000         # <MEASURE> magnets stop grabbing (~attach_y + 10 to start)
                              # interacting with a docked tool
params_attach_y: -1000        # <MEASURE> screws aligned with keyslot openings
                              # large keyslot openings
params_fast_speed: 6000       # mm/min, print area <-> close_y
params_path_speed: 1000       # mm/min, through the dock slots

initialize_on: manual
# Native detection (detection_pin on each [tool]) lets bare
# INITIALIZE_TOOLCHANGER use the detected tool -- no probe-based
# detection macros needed (those were the old tool_probe pattern
# from r2pdx's plugin version; current plugin conflicts with
# Cartographer over the PROBE command).
abort_on_tool_missing: True
tool_missing_delay: 2.0

before_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
        SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
    {% endif %}

after_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
        SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'086c90'"
    {% endif %}
    {% if tool.params_input_shaper_freq_x %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x} SHAPER_FREQ_X={tool.params_input_shaper_freq_x}
        SET_INPUT_SHAPER SHAPER_TYPE_Y={tool.params_input_shaper_type_y} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y}
    {% endif %}

dropoff_gcode:
    {% set park_x = tool.params_park_x|float %}
    {% set detach_x = tool.params_detach_x|float %}
    {% set fast = tool.params_fast_speed|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set cur_z = printer.toolhead.position[2]|float %}
    RESPOND TYPE=echo MSG='Dropping off {tool.name}'
    ; (crash monitoring pauses automatically during changes -- native abort_on_tool_missing)
    G90
    G0 Z{ [cur_z+1.0, max_z]|min } F{fast}                  ; 1mm hop off the print
    G0 X{detach_x} Y{tool.params_safe_toolhead_y} F{fast}   ; clear docked tools
    G0 Y{tool.params_attach_y} F{fast}                      ; into keyslot opening line
    G0 X{park_x} F{tool.params_path_speed}                  ; slide into slot
    G0 Y{tool.params_close_y} F{tool.params_path_speed}     ; back out past magnets
    G0 Y{tool.params_safe_shuttle_y} F{fast}                ; bare-carriage safe line

pickup_gcode:
    {% set park_x = tool.params_park_x|float %}
    {% set detach_x = tool.params_detach_x|float %}
    {% set fast = tool.params_fast_speed|float %}
    RESPOND TYPE=echo MSG='Picking up {tool.name}'
    G90
    G0 Y{tool.params_safe_shuttle_y} F{fast}
    G0 X{park_x} F{fast}
    G0 Y{tool.params_close_y} F{fast}
    ; heat the incoming tool to target while it rests in its dock
    {% if tool.extruder %}
        M104 T{tool.tool_number} S{printer[tool.extruder].target|int}
        _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER={tool.extruder} TOLERANCE=0.5
    {% endif %}
    G0 Y{tool.params_attach_y} F{tool.params_path_speed}    ; engage coupling
    G0 X{detach_x} F{tool.params_path_speed}                ; slide out of slot
    G0 Y{tool.params_safe_toolhead_y} F{fast}
    {% if 'Z' in restore_position %}
        G0 Z{restore_position.Z|float + 1 } F{fast}
    {% endif %}
    {% if 'X' in restore_position %}
        G0 X{restore_position.X} F{fast}
    {% endif %}
    {% if 'Y' in restore_position %}
        G0 Y{restore_position.Y} F{fast}
    {% endif %}
    {% if 'Z' in restore_position %}
        G0 Z{restore_position.Z} F{fast}
    {% endif %}
    G90


# Detection & crash handling are native in the current plugin:
# detection_pin per [tool] + abort_on_tool_missing above. No
# [tool_probe]/[tool_probe_endstop] sections -- those register a
# PROBE command that conflicts with Cartographer's [scanner].