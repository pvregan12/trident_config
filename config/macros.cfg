#####################################################################
#   Print Start -- generalized for either-tool probing
#####################################################################
# Adapted from r2pdx (GPL-3.0, zruncho3d/madmax). Changes:
#  - Probe tool = INITIAL_TOOL (the tool printing first). If only one
#    tool is used, that's it. No T0-always assumption: this build's
#    Cartographer is core-mounted, and touch-homing works through
#    whichever nozzle is attached.
#  - Only USED tools ever heat (r2pdx always heated T0 as probe head).
#  - _TOUCH_HOME_ACTIVE_TOOL wrapper handles the Z-datum bookkeeping
#    when the probing tool is not T0 (see its comments -- SIGN of the
#    compensation must be verified empirically in Phase 7).
#
## Orca / Prusa Slicer start gcode (unchanged interface):
## print_start TOOL_0_START={first_layer_temperature[0]} TOOL_1_START={first_layer_temperature[1]} BED={first_layer_bed_temperature[0]} INITIAL_TOOL={initial_tool} IST0={is_extruder_used[0]} IST1={is_extruder_used[1]}
##
## Toolchange gcode (ooze prevention, important for Prusa Slicer):
## M104 S{temperature[next_extruder]} T{next_extruder}

[gcode_macro print_start]
gcode:
  {% set bed_temp = params.BED %}
  {% set used = {} %}
  {% if params.IST0|upper == "TRUE" %}{% set _ = used.update({0: params.TOOL_0_START}) %}{% endif %}
  {% if params.IST1|upper == "TRUE" %}{% set _ = used.update({1: params.TOOL_1_START}) %}{% endif %}
  {% if used|length == 0 %}
    {% set _ = used.update({0: params.TOOL_0_START}) %}  # defensive: slicer sent no used flags
  {% endif %}
  # Probe tool: the tool that prints first. If the slicer's
  # INITIAL_TOOL is somehow not in the used set, fall back to the
  # first used tool.
  {% set initial = params.INITIAL_TOOL|default(0)|int %}
  {% set probe_tool = initial if initial in used else (used.keys()|list)[0] %}
  RESPOND MSG="print_start: tools used {used.keys()|list}, probing with T{probe_tool}"

  # Ooze-managed preheat: ALL used tools to 150 (soft enough to
  # manage drool, hot enough for accurate touch thermal state).
  {% for t in used %}
    {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_HEATING
    {% endif %}
    M104 S150 T{t}
  {% endfor %}
  M190 S{bed_temp}
  # Wait for the probing tool specifically.
  M109 S150 T{probe_tool}

  SMART_HOMING
  # Make the probing tool active (no-op dock cycle if already mounted)
  T{probe_tool}
  _TOUCH_HOME_ACTIVE_TOOL
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Park for final heat-up without oozing on the print area.
  # <VERIFY>: original was X100 Y5 -- Y5 is deep in MadMax dock
  # territory on this machine. Park mid-bed-front OUTSIDE the dock
  # keep-out, or rear. Placeholder below is rear-biased; set after
  # Phase 6 establishes the keep-out zone.
  G90
  G0 X150 Y250 Z10 F12000   # <VERIFY>

  # Heat only used tools to print temps; wait on the initial tool last.
  {% for t, temp in used.items() %}
    {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_HEATING
    {% endif %}
    {% if t != probe_tool %} M104 S{temp} T{t} {% endif %}
  {% endfor %}
  {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_HEATING
    {% endif %}
  M109 S{used[probe_tool]} T{probe_tool}

  # Prime used tools; initial tool primed LAST so it starts fresh.
  {% for t in used %}
    {% if t != initial %}
      RESPOND MSG="Priming T{t}"
      T{t}
      {% if printer["gcode_macro _sb_vars"] is defined %}
        STATUS_BUSY
      {% endif %}
      PRIME_ACTIVE_TOOL T={t}
    {% endif %}
  {% endfor %}
  RESPOND MSG="Priming T{initial}"
  T{initial}
  {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_BUSY
    {% endif %}
  PRIME_ACTIVE_TOOL T={initial}

#####################################################################
#   _TOUCH_HOME_ACTIVE_TOOL -- touch homing with datum bookkeeping
#####################################################################
[gcode_macro _TOUCH_HOME_ACTIVE_TOOL]
description: CARTOGRAPHER_TOUCH_HOME with whichever tool is active,
  preserving BOTH physical Z correctness AND _CHANGE_TOOL's invariant
  (homing_origin.z == active tool's saved delta + babystep).
gcode:
  {% set tn = printer.toolchanger.tool_number|int if printer.toolchanger is defined else 0 %}
  # Clear the per-tool Z offset so the touch measures the bare nozzle.
  # print_start context: fresh print, no babystep to preserve yet.
  SET_GCODE_OFFSET Z=0 MOVE=0
  CARTOGRAPHER_TOUCH_HOME
  {% if tn > 0 %}
    # Touch zeroed the MACHINE frame to T{tn}'s nozzle. The offset
    # save-file (and _CHANGE_TOOL's modified_z math) assume a T0-zero
    # machine frame. Convention confirmed from _CHANGE_TOOL: saved
    # z delta is applied as a positive gcode offset when the nozzle
    # sits lower than T0's, i.e. frame conversion is
    #   Z_in_T0_frame = Z_in_T{tn}_frame + delta.
    # Step 1: re-frame machine Z to the T0 datum (no motion).
    # Step 2: re-apply T{tn}'s stored offset, restoring the invariant
    #         _CHANGE_TOOL relies on for babystep extraction.
    {% set svf = printer.save_variables.variables %}
    {% set delta = svf["t" ~ tn ~ "_offset_z"]|default(0)|float %}
    G90
    G0 Z10 F1800
    M400
    SET_KINEMATIC_POSITION Z={10 + delta}
    SET_GCODE_OFFSET Z={delta} MOVE=0
    RESPOND MSG="Touch via T{tn}: machine frame re-referenced to T0 datum (delta {delta}mm), tool offset restored"
    # !! PHASE 7 VERIFICATION: print one-layer patches probed-with-T0
    # vs probed-with-T{tn}; identical squish confirms the frame math
    # and the save-file sign convention end-to-end. A 2x-delta error
    # means CARTOGRAPHER_TOUCH_HOME's internal origin handling differs
    # from the assumption here -- report back and we adjust.
  {% endif %}

#####################################################################
#  Print End
#####################################################################
[gcode_macro print_end]
gcode:
  {% set z_end_hop = 5.0|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set park_y = printer.configfile.config["stepper_y"]["position_max"]|float - 10 %}
  G90   # print gcode may leave us in relative mode
  ## CHANGED from r2pdx: no forced switch to T0. His T0-swap staged
  ## the probing head for the next print; any tool probes here, so
  ## the ending tool just stays mounted -- one less dock cycle.
  G0 Z{ [cur_z+z_end_hop, max_z]|min }
  G0 Y{park_y}
  TURN_OFF_HEATERS
  M107
  M84

#####################################################################
#  Printer Sleep -- unchanged from r2pdx (guards make it portable)
#####################################################################
[gcode_macro printer_sleep]
description: Shutdown all lights, heaters, and motors for the printer.
gcode:
    # LED names matched to this build's [neopixel T0_leds]/[T1_leds]
    {% if printer["neopixel T0_leds"] is defined %}
      SET_LED LED=T0_leds RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    {% if printer["neopixel T1_leds"] is defined %}
      SET_LED LED=T1_leds RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    {% if printer["neopixel chamber_light"] is defined %}
      SET_LED LED=chamber_light RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    M84
    M107
    {% if printer["fan_generic bed_fan"] is defined %}
      SET_FAN_SPEED FAN=bed_fan SPEED=0
    {% endif %}
    TURN_OFF_HEATERS

#####################################################################
#  Hotend Fans Watch
#####################################################################

[gcode_macro CHECK_HOTEND_FANS]
# Hotend fan watchdog via the gpio16 tach signals. Klipper only
# reports RPM; this acts on it. Checks BOTH tools -- a docked hot
# tool with a dead fan heat-creeps silently.
gcode:
    {% set min_rpm = params.MIN_RPM|default(1000)|int %}
    {% for tool, heater in [('T0', 'extruder'), ('T1', 'extruder1')] %}
        {% if printer['heater_fan ' + tool + '_hotend_fan'] is defined %}
            {% set fan = printer['heater_fan ' + tool + '_hotend_fan'] %}
            {% set temp = printer[heater].temperature %}
            {% if temp > 60 and fan.rpm is not none and fan.rpm < min_rpm %}
                {action_respond_info(tool ~ " hotend fan below " ~ min_rpm ~ " RPM (" ~ fan.rpm|round(0)|int ~ ") while hot -- pausing")}
                SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
                PAUSE
            {% endif %}
        {% endif %}
    {% endfor %}

[delayed_gcode hotend_fan_watchdog]
initial_duration: 30
gcode:
    CHECK_HOTEND_FANS
    UPDATE_DELAYED_GCODE ID=hotend_fan_watchdog DURATION=30    
