#    {% endif %}

[gcode_macro CLEAN_NOZZLE]
description: Stub -- called by the Z_TILT_ADJUST wrapper when the
  nozzle is hot. Replace with real brush/purge moves once a nozzle
  brush is installed; until then it just reports.
gcode:
    RESPOND MSG="CLEAN_NOZZLE: no brush configured (stub)"

[gcode_macro PRINT_START]
# Slicer: PRINT_START BED=... T0_TEMP=... T1_TEMP=... TOOLS_USED=...
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set t0 = params.T0_TEMP|default(0)|float %}
    {% set t1 = params.T1_TEMP|default(0)|float %}
    M140 S{bed}
    G28
    Z_TILT_ADJUST
    G28 Z                          ; re-home Z after tilt
    M190 S{bed}
    BED_MESH_CALIBRATE ADAPTIVE=1  ; Cartographer scan mesh
    # Preheat only the tools this print uses
    {% if t0 > 0 %} M104 T0 S{t0} {% endif %}
    {% if t1 > 0 %} M104 T1 S{t1} {% endif %}
    T0                             ; start with tool 0 (or slicer's initial tool)
    {% if t0 > 0 %} M109 T0 S{t0} {% endif %}
    # Automatic XYZ offset calibration (Nudge + r2pdx macros).
    # Uncomment once installed & commissioned; skips are fine for
    # single-tool prints -- gate on TOOLS_USED if desired:
    # TC_FIND_ALL_TOOL_OFFSETS
    LINE_PURGE                     ; or your purge/prime of choice

[gcode_macro PRINT_END]
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G0 Z10 F1800
    G90
    # Park active tool in its dock so the gantry is clear (optional):
    # DROPOFF_TOOL
    G0 X150 Y250 F12000
    M84

[gcode_macro CHECK_HOTEND_FANS]
# Hotend fan watchdog using the gpio16 tach signal. Klipper only
# *reports* RPM; it won't act on it natively -- this macro does.
# Call periodically (e.g. from a [delayed_gcode] loop, or in your
# layer-change gcode alongside VERIFY_TOOL_DETECTED).
# Especially important on a toolchanger: the DOCKED tool can sit
# hot with a dead fan and you'd never hear it.
gcode:
    {% set min_rpm = params.MIN_RPM|default(1000)|int %}
    {% for tool, heater in [('T0', 'extruder'), ('T1', 'extruder1')] %}
        {% set fan = printer['heater_fan ' ~ tool ~ '_hotend_fan'] %}
        {% set temp = printer[heater].temperature %}
        {% if temp > 60 and fan.rpm is not none and fan.rpm < min_rpm %}
            {action_respond_info(tool ~ " hotend fan below " ~ min_rpm ~ " RPM (" ~ fan.rpm|round(0)|int ~ ") while hot -- pausing")}
            M104 { 'T0 ' if tool == 'T0' else 'T1 ' }S0
            PAUSE
        {% endif %}
    {% endfor %}

[delayed_gcode hotend_fan_watchdog]
initial_duration: 30
gcode:
    CHECK_HOTEND_FANS
    UPDATE_DELAYED_GCODE ID=hotend_fan_watchdog DURATION=30

# Dock reliability testing: use DOCK_SEQUENCE REPS=n from
# klipper-toolchanger's provided macros.cfg (loaded at Phase 5)
# rather than a homegrown cycle macro.

# M106/M107 fan mapping to active tool is provided by
# klipper-toolchanger's included macros -- don't redefine here.