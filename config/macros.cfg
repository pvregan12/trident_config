# COMMENTED OUT by default because homing_toolchanger.cfg provides
# the real [homing_override] -- Klipper merges duplicate sections
# silently (last include wins), so having both active means whichever
# file is included later quietly disables the other. Uncomment this
# AND comment the homing_toolchanger.cfg include during Phases 1-3;
# revert both at Phase 5.
