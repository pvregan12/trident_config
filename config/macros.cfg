# =============================================================
# macros.cfg -- ALL gcode macros for this build, single file by
# design: one owner per command, no silent section merges, and
# PHASE-AWARE guards so the SAME file serves single-tool bring-up
# (toolchanger includes commented) and full toolchanger mode.
# Adapted from r2pdx's MadMax sample configs (GPL-3.0,
# zruncho3d/madmax) + viesturz/klipper-toolchanger macros.
# Local adaptations: QGL->Z_TILT_ADJUST; core-mounted Cartographer
# (any initialized tool may home; no probing-temp clamps -- homing
# hot is fine, touch temps are print_start's job); _TAP_PROBE_ACTIVATE
# dropped (tap-style probing not used).
# =============================================================

#============================================================
# HOMING / LEVELING
#============================================================

[gcode_macro homing_variables]
## Set these coordinates to your preferred z homing location.
## These are not used if using nudge as an end stop.
variable_safe_home_x: -1000
variable_safe_home_y: -1000
## Set this to your preferred speed for homing in mm per minute.
variable_safe_home_feed: 12000
## Set this if you use your offset probe for your Z endstop.
variable_use_nudge_as_endstop: False
## Do not edit below this line, variables used within the homing_override macro.
variable_x: False
variable_y: False
variable_z: False
variable_modified_z: 0.000
gcode:

[homing_override]
axes: xyz
gcode:
    # Reset parameters.
    {% set X, Y, Z = False, False, False %}
    {% set hv = printer["gcode_macro homing_variables"] %}
    {% set svf = printer.save_variables.variables %}   
    # Which axes have been requested for homing.
    {% if not 'X' in params
        and not 'Y' in params
        and not 'Z' in params %}
        {% set X, Y, Z = True, True, True %}
        SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=x VALUE=True
        SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=y VALUE=True
        SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=z VALUE=True
        {% if hv.use_nudge_as_endstop %}
          SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=safe_home_x VALUE={svf.nudge_position_x|float|round(3)}
          SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=safe_home_y VALUE={svf.nudge_position_y|float|round(3)}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=modified_z VALUE={printer.gcode_move.homing_origin.z|float|round(3)}
    {% else %}
        {% if 'X' in params %}
            {% set X = True %}
            SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=x VALUE=True
        {% endif %}
        {% if 'Y' in params %}
            {% set Y = True %}
            SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=y VALUE=True
        {% endif %}
        {% if 'Z' in params %}
            {% set Z = True %}
            SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=z VALUE=True
            SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=modified_z VALUE={printer.gcode_move.homing_origin.z|float|round(3)}
        {% endif %}
    {% endif %}
    # Initialize the toolchanger
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if printer.toolchanger is defined %}
      INITIALIZE_TOOLCHANGER    ; PHASE-AWARE: no-op in single-tool mode
    {% endif %}
    {% endif %}
    # Call the actual macro that the homing is done in, so the toolchanger object is up to date
    _HOMING_STUFF
    
    {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_READY
    {% endif %}
    # Reset the homing variables
    SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=x VALUE=False
    SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=y VALUE=False
    SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=z VALUE=False
    SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=modified_z VALUE=0.000

[gcode_macro _HOMING_STUFF]
gcode: 
    {% set hv = printer["gcode_macro homing_variables"] %}
    ## ADAPTED: any initialized tool may home (see header)
    {% if printer.toolchanger is not defined or printer.toolchanger.tool_number|int >= 0 %}
      {% if "xyz" not in printer.toolhead.homed_axes %}
        # Add 10mm nozzle-bed clearance before homing moves. Z+ in
        # print coordinates; on this fixed-gantry Trident the BED
        # physically drops (Klipper's kinematics translate). Done
        # blind via SET_KINEMATIC_POSITION, so if the bed is already
        # at its physical bottom the steppers will skip -- harmless
        # for leadscrews, and unavoidable when Z state is unknown.
        SET_KINEMATIC_POSITION Z=0
        G1 Z10 F2000
      {% endif %}
      {% if hv.y %}
        {% set y_pos = printer.configfile.config.stepper_y.position_endstop|float - 30 %}
        {% if printer["gcode_macro _sb_vars"] is defined %}
          STATUS_HOMING
        {% endif %}
        G28 Y
        G0 Y{y_pos} F{hv.safe_home_feed}
      {% endif %}
      {% if hv.x %}
        {% if printer["gcode_macro _sb_vars"] is defined %}
          STATUS_HOMING
        {% endif %}
        G28 X
      {% endif %}
      {% if hv.z %}
        {% if printer["gcode_macro _sb_vars"] is defined %}
          STATUS_HOMING
        {% endif %}
        # Move to z position switch location
        ## Bounds check BOTH axes, both directions: catches the -1000
        ## sentinels AND typos beyond max (Y especially -- overshooting
        ## Y drives toward the dock zone).
        {% set cfg = printer.configfile.config %}
        {% set shx = hv.safe_home_x|float %}
        {% set shy = hv.safe_home_y|float %}
        {% if shx < cfg["stepper_x"]["position_min"]|float
           or shx > cfg["stepper_x"]["position_max"]|float
           or shy < cfg["stepper_y"]["position_min"]|float
           or shy > cfg["stepper_y"]["position_max"]|float %}
          RESPOND TYPE=error MSG="safe_home_x/y unset or out of bounds -- set them in [gcode_macro homing_variables] in macros.cfg"
          G91
          G0 X-10
          G90
          M84
        {% else %}
          G0 X{hv.safe_home_x} Y{hv.safe_home_y} F{hv.safe_home_feed}
          G28 Z
          G0 Z10 F{hv.safe_home_feed}
          SET_GCODE_OFFSET Z={hv.modified_z} MOVE=1
        {% endif %}
      {% endif %}
      
      SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=x VALUE=False
      SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=y VALUE=False
      SET_GCODE_VARIABLE MACRO=homing_variables VARIABLE=z VALUE=False
    {% else %}
      RESPOND TYPE=error MSG="No tool initialized -- check tool detection, or run INITIALIZE_TOOLCHANGER T=n manually."
      M84
    {% endif %}

#####################################################################
#  Z Tilt Adjust override
#####################################################################

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description: Override of Z_TILT_ADJUST (Trident; adapted from QGL version)
gcode:
    # If not homed, home the printer first.
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=echo MSG="Printer not homed, forcing full home."
        G28
    {% endif %}
    # Set the tool head LED's
    STATUS_LEVELING
    _Z_TILT_ADJUST
    # Clean the nozzle if it is hot
    {% if printer.extruder.temperature|int > 140 %}
      CLEAN_NOZZLE
    {% endif %}
    # Re-home Z.
    G28 Z

#####################################################################
#   Smart Homing
#####################################################################

[gcode_macro SMART_HOMING]
description: Homes gantry and adjusts z tilt if not already done.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %}
      RESPOND TYPE=echo MSG="Printer gantry already homed, skipping G28."
    {% endif %}
    # Adjust QGL if not done
    {% if printer.z_tilt is defined %}
      {% if printer.z_tilt.applied == False %}
        Z_TILT_ADJUST
      {% else %}
        RESPOND TYPE=echo MSG="Bed tilt already adjusted, skipping Z_TILT_ADJUST."
      {% endif %}
    {% endif %}

#============================================================
# TOOLCHANGE MACHINERY
#============================================================

[gcode_macro DOCK_SEQUENCE]
description: Run a docking sequence for both tool heads, with number of times.
  Usage: DOCK_SEQUENCE REPS={x (default 10)} DELAY={time in seconds}
gcode:
  {% for i in range(0, params.REPS|default(10)|int)  %}
    T0
    G4 P{params.DELAY|default(1)|float * 1000.0}
    T1
    G4 P{params.DELAY|default(1)|float * 1000.0}
  {% endfor %}
  ## Leave T0 active last
  T0

#####################################################################
#  _CHANGE_TOOL
#####################################################################

[gcode_macro _CHANGE_TOOL]
description: Changes tools, updates offsets and transfers fan control to the next tool head.
  If tool head LEDs are defined, will set READY, BUSY, or PRINTING.
  Usage: _CHANGE_TOOL T={tool_number}
gcode:
  {% set tool_number = params.T|int %}
  {% set svf = printer.save_variables.variables %}
  {% set modified_z = 0.0 %}
  {% set last_tool = printer.toolchanger.tool_number|int %}
  {% if last_tool|int >= 0 %}
    # Grab the current tool number so we can remove any z offset that is present
    {% set z_offset_val = svf[ 't' + printer.toolchanger.tool_number|string + '_offset_z'] %}
    # Subtract the tool z_offset from the homing_origin, the remainder is any tweaked z offset
    {% set modified_z = printer.gcode_move.homing_origin.z|float|round(3) - z_offset_val|float|round(3) %}
    # Grab the current print fan speed
    {% set active_fan = "fan_generic part_fan_t" + printer.toolchanger.tool_number|string %}
    {% set fan_speed = printer[active_fan].speed|float|round(2) %}
    # Shutdown the active part cooling fan
    SET_FAN_SPEED FAN="part_fan_t{printer.toolchanger.tool_number|string}" SPEED=0
    # Clear the offsets set by macros
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
    # Update toolhead lights if applicable
    {% if printer["gcode_macro _sb_vars"] is defined %}
      STATUS_READY
    {% endif %}
  {% endif %}
  # Activate the selected tool
  SELECT_TOOL T={tool_number}
  # Apply the macro offsets, including modified z settings
  SET_GCODE_OFFSET X={svf[ 't' + tool_number|string + '_offset_x']|float|round(3)} Y={svf[ 't' + tool_number|string + '_offset_y']|float|round(3)} Z={svf[ 't' + tool_number|string + '_offset_z']|float + modified_z|float|round(3)} MOVE=1
  # Transfer the print fan speed to the active tool head
  {% if last_tool|int >= 0 %}
    SET_FAN_SPEED FAN="part_fan_t{tool_number}" SPEED={fan_speed}
  {% endif %}
  # Update toolhead lights if applicable
  {% if printer["gcode_macro _sb_vars"] is defined %}
    {% if printer.idle_timeout.state != "Printing" %}
      STATUS_READY
    {% else %}
      STATUS_PRINTING
    {% endif %}
  {% endif %}
  # Update the current tool variable in the save file
  SAVE_VARIABLE VARIABLE=current_tool VALUE={tool_number}

#####################################################################
#   _TAP_PROBE_ACTIVATE
#####################################################################

[gcode_macro _WAIT_FOR_TEMP_WITHIN_TOLERANCE]
description: Wait for temperature to get within tolerance
gcode:
    {% set tolerance = params.TOLERANCE | float  %}
    {% set actual = printer[params.HEATER].temperature | float %}
    {% set target = printer[params.HEATER].target | float %}
    {% if target != 0 and ((actual < (target - tolerance)) or (actual > (target + tolerance))) %}
        { action_respond_info('Extruder temperature %.1fC is not within %.1fC of %.1fC target; waiting...' % (actual, tolerance, target)) }
        RESPOND TYPE=echo MSG='TEMPERATURE_WAIT SENSOR={params.HEATER} MINIMUM={target - tolerance} MAXIMUM={target + tolerance}'
        TEMPERATURE_WAIT SENSOR={params.HEATER} MINIMUM={target - tolerance} MAXIMUM={target + tolerance}
    {% endif %}

#####################################################################
#   M104
#####################################################################

[gcode_macro M104]
rename_existing: M104.1
description: [T<index>] [S<temperature>]
  Set tool temperature.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
    {% if params.T is defined %}
      {% set newparameters = "" %}
      {% set newparameters = newparameters ~ " T="~params.T %}
      {% if params.S is defined %}
        {% set newparameters = newparameters ~ " TARGET="~params.S %}
      {% endif %}
      SET_TOOL_TEMPERATURE{newparameters}
    {% else %}
      M104.1 {rawparams}
    {% endif %}

#####################################################################
#   M109
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
description: [T<index>] [S<temperature>]
  Set tool temperature and wait.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
    {% if params.T is defined %}
      {% set newparameters = "" %}
      {% set newparameters = newparameters ~ " T="~params.T %}
      {% if params.S is defined %}
        {% set newparameters = newparameters ~ " TARGET="~params.S %}
      {% endif %}
      SET_TOOL_TEMPERATURE WAIT=1 {newparameters}
    {% else %}
      M109.1 {rawparams}
    {% endif %}

#####################################################################
#   M106
#####################################################################

[gcode_macro M106]
description: Override "M106" to account for multiple extruders.
gcode:
    {% set raw_speed = params.S|default(255)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    ## PHASE-AWARE: without the toolchanger loaded (Phases 1-3),
    ## route to T0's fan so stock slicer M106 works unchanged.
    {% if printer.toolchanger is not defined %}
      {% set fan_tool = "0" %}
    {% else %}
      {% set fan_tool = "0" if (printer.toolchanger.tool_number|string) == "-1" else printer.toolchanger.tool_number|string %}
    {% endif %}
    {% if (params.P) is defined %}
      {% set P_fan = "part_fan_t" + params.P|string %}
      SET_FAN_SPEED FAN={P_fan} SPEED={fan_speed}
    {% else %}
      SET_FAN_SPEED FAN="part_fan_t{fan_tool}" SPEED={fan_speed}
    {% endif %}

#####################################################################
#   M107
#####################################################################

[gcode_macro M107]
description: Override "M107" to account for multiple extruders.
gcode:
    # If we specified a fan, turn it off
    {% if (params.P) is defined %}
      M106 S0 P{params.P}
    {% else %}
      # Otherwise, turn off all part cooling fans
      {% set num_tools = (printer.toolchanger.tool_numbers|length|int) if printer.toolchanger is defined else 1 %}
      # Loop through the tools.
      {% for i in range(num_tools) %}
        # Turn off the fans
        M106 S0 P{i}
      {% endfor %}
    {% endif %}

# -------- B. TOOLCHANGER HOMING (r2pdx, ADAPTED) -----------------
# Changes from upstream (r2pdx homing_override.cfg, now merged here):
#  - QUAD_GANTRY_LEVEL override -> Z_TILT_ADJUST override (Trident)
#  - any initialized tool may home (core-mounted Cartographer =
#    tool-independent Z datum; upstream required T0 because his
#    probe is the active tool's coupling)
#  - safe_home_x/y -> bed center for Cartographer (set real values;
#    -1000 refuses to home, loudly, until measured)
# Owns [homing_override] in toolchanger mode.

#####################################################################
#   Homing Overrides
#####################################################################

#============================================================
# PRINT LIFECYCLE + WATCHDOG
#============================================================

[gcode_macro CLEAN_NOZZLE]
description: Stub -- called by the Z_TILT_ADJUST wrapper when the
  nozzle is hot. Replace with real brush/purge moves once a nozzle
  brush is installed.
gcode:
    RESPOND MSG="CLEAN_NOZZLE: no brush configured (stub)"

[gcode_macro CHECK_HOTEND_FANS]
# Hotend fan watchdog via the gpio16 tach signals. Klipper only
# reports RPM; this acts on it. Checks BOTH tools -- a docked hot
# tool with a dead fan heat-creeps silently.
gcode:
    {% set min_rpm = params.MIN_RPM|default(1000)|int %}
    {% for tool, heater in [('T0', 'extruder'), ('T1', 'extruder1')] %}
        {% if printer['heater_fan ' + tool + '_hotend_fan'] is defined %}
            {% set fan = printer['heater_fan ' + tool + '_hotend_fan'] %}
            {% set temp = printer[heater].temperature %}
            {% if temp > 60 and fan.rpm is not none and fan.rpm < min_rpm %}
                {action_respond_info(tool ~ " hotend fan below " ~ min_rpm ~ " RPM (" ~ fan.rpm|round(0)|int ~ ") while hot -- pausing")}
                SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
                PAUSE
            {% endif %}
        {% endif %}
    {% endfor %}

[delayed_gcode hotend_fan_watchdog]
initial_duration: 30
gcode:
    CHECK_HOTEND_FANS
    UPDATE_DELAYED_GCODE ID=hotend_fan_watchdog DURATION=30

# ---- print start / end ------------------------------------------
[gcode_macro PRINT_START]
# Slicer: PRINT_START BED=... T0_TEMP=... T1_TEMP=...
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set t0 = params.T0_TEMP|default(0)|float %}
    {% set t1 = params.T1_TEMP|default(0)|float %}
    M140 S{bed}
    G28
    Z_TILT_ADJUST
    G28 Z
    M190 S{bed}
    BED_MESH_CALIBRATE ADAPTIVE=1
    {% if t0 > 0 %} M104 T0 S{t0} {% endif %}
    {% if t1 > 0 %} M104 T1 S{t1} {% endif %}
    T0
    {% if t0 > 0 %} M109 T0 S{t0} {% endif %}
    # Automatic offset calibration (Nudge + r2pdx macros), once
    # commissioned: TC_FIND_ALL_TOOL_OFFSETS
    LINE_PURGE                     ; KAMP; replace with manual purge if no KAMP

[gcode_macro PRINT_END]
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G0 Z10 F1800
    G90
    G0 X150 Y250 F12000
    M84

# Dock reliability testing: DOCK_SEQUENCE REPS=n (toolchanger_suite)