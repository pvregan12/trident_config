# =============================================================
# Tool 0 -- LDO Nitehawk36 (USB toolhead board, RP2040)
# Flash Katapult+Klipper per LDO docs; each board gets a unique
# /dev/serial/by-id path. LABEL YOUR BOARDS/CABLES T0 vs T1.
# =============================================================

#####################################################################
#    MCU Definition
#####################################################################

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NITEHAWK36_T0-if00   # <VERIFY>
restart_method: command

#####################################################################
#    Extruder
#####################################################################

[extruder1]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25

rotation_distance: 22.67    # calibrate; example for CW2/Galileo-style
gear_ratio: 50:10           # <VERIFY for your extruder>

microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750

max_extrude_only_distance: 150
max_extrude_cross_section: 5   # toolchanger purge lines

### Extruder Heater ###
heater_pin: nhk1:gpio9
sensor_type: PT1000                # PT1000 RTD; Nitehawk36's 2.2k pullup is designed for this
sensor_pin: nhk1:gpio29
pullup_resistor: 2200       # Nitehawk36 fixed 2.2k pullup -- required for correct PT1000 readings
min_temp: 0
max_temp: 300
max_power: 1.0

min_extrude_temp: 170

control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96                  # run PID_CALIBRATE per tool
pressure_advance: 0.035     # tune per tool/nozzle
pressure_advance_smoooth_time: 0.040 # default is 0.040, mostly leave alone

[tmc2209 extruder1]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
uart_address: 0
interpolate: false
run_current: 0.6            # <VERIFY for your extruder motor>
sense_resistor: 0.100
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

# Part cooling fan -- per-tool fan_generic; r2pdx macros
# (found in macros.cfg) route M106 to the active tool.
# Part fan is fan_generic per r2pdx pattern: M106/M107 overrides in
# toolchanger_macros.cfg route to the active tool; _CHANGE_TOOL
# transfers fan speed between tools. (Phases 1-3 single-tool).
# for T1, this should always be fan_generic
[fan_generic part_fan_t1]
pin: nhk1:gpio6
kick_start_time: 0.5
off_below: 0.10

[heater_fan T1_hotend_fan]
pin: nhk1:gpio5
tachometer_pin: ^nhk1:gpio16   # requires a 3-wire (tach) 2510 fan;
tachometer_ppr: 2              # <VERIFY> pulses/rev from fan datasheet (2 is typical)
tachometer_poll_interval: 0.0009
heater: extruder
heater_temp: 50.0



#####################################################################
#   Toolhead 1 LEDs
#####################################################################

[neopixel T1_leds]
pin: nhk1:gpio7
chain_count: 3              # number of LEDs daisy chained to provided pin
color_order: GRBW           # <VERIFY LED type>
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

#####################################################################
#   Toolhead 1 Filament runout switch
#####################################################################

#[filament_switch_sensor T0_Filament_Runout_Sensor]
#pause_on_runout: False
#runout_gcode:
#insert_gcode:
#switch_pin: toolboard_1: PB8

#####################################################################
#   Accelerometer
#####################################################################

# Accelerometer for input shaper (Nitehawk36 onboard ADXL345)
[adxl345 T1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19

[resonance_tester]
accel_chip: adxl345 T0
probe_points: 150, 150, 20


#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor nhk1]
sensor_type: temperature_mcu
sensor_mcu: nhk1
min_temp: 0
max_temp: 100

# ------------------- toolchanger sections for T0 -------------------
# Per official MadMax convention, per-head docking params live here.
# T0 = LEFT dock (minus-X side) in the MadMax convention.

[gcode_macro T1]
variable_color: ""
variable_tool_number: 0
gcode:
  _CHANGE_TOOL T={tool_number}

[tool T1]
tool_number: 1
detection_pin: ^nhk1:gpio13   # Maxwell coupling via X-ENDSTOP port;
                              # !! polarity ('!') unverified until Phase 5.3;
                              # note 2026 plugin change inverted this convention
extruder: extruder

## Offsets handled by _CHANGE_TOOL from the save file -- KEEP THESE 0
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

# Docking parameters
params_park_x: -1000     # <MEASURE> screws fully within dock slot; -1000 fails loudly if unset
params_detach_x: -1000   # <MEASURE> screws safely outside dock slot (park_x +/- ~4-5mm)

# per-tool input shaper (fill from SHAPER_CALIBRATE if T0/T1 differ):
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 63.0
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 53.0
