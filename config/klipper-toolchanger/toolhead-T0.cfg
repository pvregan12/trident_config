# =============================================================
# Tool 0 -- LDO Nitehawk36 (USB toolhead board, RP2040)
# Flash Katapult+Klipper per LDO docs; each board gets a unique
# /dev/serial/by-id path. LABEL YOUR BOARDS/CABLES T0 vs T1.
# =============================================================

#####################################################################
#    MCU Definition
#####################################################################

[mcu nhk0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619069D-if00   # <VERIFY>
restart_method: command

#####################################################################
#    Extruder
#####################################################################

[extruder]
step_pin: nhk0:gpio23       # verified
dir_pin: nhk0:gpio24        # verified
enable_pin: !nhk0:gpio25    # UART, TX : 0, 1 ;see tmc2209 below

rotation_distance: 22.67    # calibrate; example for CW2/Galileo-style
gear_ratio: 50:10           # verified for sherpa mini

microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750

max_extrude_only_distance: 150
max_extrude_cross_section: 0.64   # toolchanger purge lines

### Extruder Heater ###
heater_pin: nhk0:gpio9      # verified
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk0:gpio29     # verified
pullup_resistor: 2200       # Nitehawk36 fixed 2.2k pullup 
min_temp: 0
max_temp: 300
max_power: 1.0

min_extrude_temp: 170

control: pid
pid_kp: 26
pid_ki: 1.7
pid_kd: 96                  # run PID_CALIBRATE per tool
pressure_advance: 0.035     # tune per tool/nozzle
pressure_advance_smooth_time: 0.040 # default is 0.040, mostly leave alone

[tmc2209 extruder]
uart_pin: nhk0:gpio0        # verified
tx_pin: nhk0:gpio1          # verified
uart_address: 0
interpolate: false
run_current: 0.500            # <VERIFY for your extruder motor>
sense_resistor: 0.100
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

# Part cooling fan -- per-tool fan_generic; r2pdx macros
# (found in macros.cfg) route M106 to the active tool.
# Part fan is fan_generic per r2pdx pattern: M106/M107 overrides in
# macros.cfg route to the active tool; _CHANGE_TOOL
# transfers fan speed between tools. (Phases 1-3 single-tool: rename
# this section to plain [fan] so stock M106 works, then revert.)
[fan_generic part_fan_t0]
#[fan]
pin: nhk0:gpio6                  # verified
kick_start_time: 0.5
off_below: 0.10

[heater_fan T0_hotend_fan]
pin: nhk0:gpio5                  # verified
tachometer_pin: ^nhk0:gpio16     # requires a 3-wire (tach) 2510 fan;
tachometer_ppr: 2                # <VERIFY> pulses/rev from fan datasheet (2 is typical)
tachometer_poll_interval: 0.0009
heater: extruder
heater_temp: 50.0

#####################################################################
#   Toolhead 0 LEDs
#####################################################################

[neopixel T0_leds]
pin: nhk0:gpio7             # verified
chain_count: 3              # number of LEDs daisy chained to provided pin
color_order: GRBW           
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

## PCB Activity Light
[output_pin act_led]
pin: !nhk0:gpio8

#####################################################################
#   Toolhead 0 Filament runout switch
#####################################################################

#[filament_switch_sensor T0_Filament_Runout_Sensor]
#pause_on_runout: False
#runout_gcode:
#insert_gcode:
#switch_pin: nhk0:gpio3    # verified

#####################################################################
#   Accelerometer
#####################################################################

# Accelerometer for input shaper (Nitehawk36 onboard ADXL345)
[adxl345 T0]
cs_pin: nhk0:gpio27                  # verified
spi_software_sclk_pin: nhk0:gpio18   # verified
spi_software_mosi_pin: nhk0:gpio20   # verified
spi_software_miso_pin: nhk0:gpio19   # verified

[resonance_tester]
accel_chip: adxl345 T0
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points: 155, 155, 20 # per LDO nitehawk example config

#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor nhk0]
sensor_type: temperature_mcu
sensor_mcu: nhk0
min_temp: 0
max_temp: 100

# ------------------- toolchanger sections for T0 -------------------
# Per official MadMax convention, per-head docking params live here.
# T0 = LEFT dock (minus-X side) in the MadMax convention.

[gcode_macro T0]
variable_color: ""
variable_tool_number: 0
gcode:
  _CHANGE_TOOL T={tool_number}

[tool T0]
tool_number: 0
detection_pin: ^nhk0:gpio13   # verified X-ENDSTOP port for Maxwell coupling;
                              # polarity ('!') unverified until Phase 5.3;
                              # note 2026 plugin change inverted this convention
extruder: extruder
fan: part_fan_t0

## Offsets handled by _CHANGE_TOOL from the save file -- KEEP THESE 0
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

# Docking parameters
params_park_x: -1000     # <MEASURE> screws fully within dock slot; -1000 fails loudly if unset
params_detach_x: -1000   # <MEASURE> screws safely outside dock slot (park_x +/- ~4-5mm)

# per-tool input shaper (fill from SHAPER_CALIBRATE if T0/T1 differ):
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 63.0
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 53.0
