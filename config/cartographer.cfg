# =============================================================
# Cartographer probe -- NEW plugin (cartographer3d-plugin) with
# Survey 5.0+ firmware. Section is [cartographer]; the older
# cartographer-klipper repo used [scanner] and is superseded.
# Install (per docs.cartographer3d.com):
#   curl -s -L https://raw.githubusercontent.com/Cartographer3D/cartographer3d-plugin/refs/heads/main/scripts/install.sh \
#     | bash -s -- --klipper ~/klipper --klippy-env ~/klippy-env
#   git clone https://github.com/Cartographer3D/cartographer_firmware.git ~/cartographer_firmware
# Update probe firmware to latest before calibration.
# =============================================================
# TOOLCHANGER NOTE unchanged: mount on the core carriage so the
# probe survives toolchanges; otherwise force T0 for all Z ops.

[mcu cartographer]
serial: /dev/serial/by-id/usb-cartographer_cartographer_...   # <VERIFY>
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0                  # <MEASURE> nozzle tip -> coil center
y_offset: 21.0               # <MEASURE>
verbose: no

[bed_mesh]
zero_reference_position: 150, 150   # bed center
speed: 300
horizontal_move_z: 3
mesh_min: 30, 30             # relative to PROBE location -- account for offsets
mesh_max: 270, 270
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0                # mesh probably dense enough, this disables interpolation

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl1345 cartographer]
cs_pin: cartographer:PA0
spi_bus: spi1

# can also add resonance tester using cartographer's adxl

# Homing: scan-based homing for general use;
# CARTOGRAPHER_TOUCH_HOME just before the print, after leveling
# (wired into our homing macros / print_start).
# stepper_z in printer.cfg keeps:
#   endstop_pin: probe:z_virtual_endstop
#   homing_retract_dist: 0