# =============================================================
# Voron Trident 300 (LDO CUBE kit) + MadMax 2-tool toolchanger
# Main MCU: LDO Leviathan v1.2 (swap pin aliases if you have an
#           Octopus-based kit -- structure is identical)
# Toolheads: 2x LDO Nitehawk36 (USB)
# Z probe: Cartographer (survey/touch)
# XY homing: physical microswitches
# =============================================================
# This is a SKELETON / resource. Pins marked <VERIFY> must be
# checked against your kit's wiring guide before first power-up.


#### main items, not toolchange related
[include mainsail.cfg]
[include macros.cfg]
[include priming.cfg]
[include cartographer.cfg]
[include klipper-toolchanger/toolhead-T0.cfg]
[include klipper-toolchanger/stealthburner_macros.cfg]
[include klipper-toolchanger/homing_override.cfg]

# toolchanger stuff
[include klipper-toolchanger/toolhead-T1.cfg]
[include klipper-toolchanger/tc_offset_calibration_macros.cfg]
[include klipper-toolchanger/tool_detection.cfg]
[include klipper-toolchanger/toolchanger_macros.cfg]
[include klipper-toolchanger/toolchanger.cfg]
#[include klipper-toolchanger/offset_save_file.cfg] -> not needed as this is a save location, not config

#### toolchanger includes


# --------------------------- MCU -----------------------------
[mcu]
# ls /dev/serial/by-id/* after flashing
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_LEVIATHAN-if00  # <VERIFY>
restart_method: command
#stm32f446re for testing
#serial: usb-STMicroelectronics_STM32_STLink_066AFF495051727187075344-if02 

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 6000            # start conservative with toolchanger mass; tune with input shaper
minimum_cruise_ratio: 0.5  #
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 350

# ------------------------ X-Y (A/B) steppers ------------------------
# NOTE on travel limits: MadMax docks live at the FRONT of the
# gantry (front-facing X rail). With both tools mounted you lose
# some Y travel near the docks; position_min / dock keep-out is
# handled in toolchanger.cfg macros, but set position_max/endstop
# from your actual measured travel after the conversion.

[stepper_x]
step_pin: PB10              # verified Leviathan HV-STEPPER-0
dir_pin: !PB11              # verified correct pin, unsure of !, this matches LDO config 
enable_pin: !PG0            # verified correct pin, unsure of !, this matches LDO config
                            # DIAG is PG1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PC1            # verified X-ENDSTOP header, microswitch
position_min: 0
position_endstop: 300       # measure after MadMax carriage installed
position_max: 300
homing_speed: 25 #50 starting slow, move to 50 once running smoothly
homing_retract_dist: 5

[tmc5160 stepper_x]
cs_pin: PE15
spi_bus: spi4
#diag0_pin: ^!PG1
#spi_software_sclk_pin: PE12
#spi_software_mosi_pin: PE14
#spi_software_miso_pin: PE13
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: False

[stepper_y]
step_pin: PF15              # verified HV-STEPPER-1
dir_pin: !PF14              # verified correct pin, unsure of !, this matches LDO config
enable_pin: !PE9            # verified correct pin, unsure of !, this matches LDO config
                            # DIAG is PE10
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PC2            # verified Y-ENDSTOP, microswitch
position_min: 0
position_endstop: 300
position_max: 300           # you may need to reduce this / reserve dock zone
homing_speed: 25 #50 starting slow, move to 50 once running smoothly
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: PE11
spi_bus: spi4
#diag0_pin: ^!PE10
#spi_software_sclk_pin: PE12
#spi_software_mosi_pin: PE14
#spi_software_miso_pin: PE13
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: False

# ------------------------- Z Steppers and Z Tilt-------------------------
# Trident: 3 independent Z with z_tilt. No Z endstop pin --
# Cartographer provides the virtual endstop.

[stepper_z]
step_pin: PD4               # verified front-left, Leviathan STEPPER-0
dir_pin: PD3                # verified correct pin, unsure of !, this matches LDO config
enable_pin: !PD7            # verified correct pin, unsure of !, this matches LDO config
                            # DIAG is PD6
rotation_distance: 4        # T8x4 leadscrew (LDO integrated leadscrew motors)
microsteps: 32
endstop_pin: probe:z_virtual_endstop   # Cartographer
position_max: 250
position_min: -5
homing_speed: 8
homing_retract_dist: 0     # REQUIRED 0 for Cartographer touch homing

[tmc2209 stepper_z]
uart_pin: PD5               # verified STEPPER-0 UART
#diag_pin: ^!PD6
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PC12              # verified rear, Leviathan STEPPER-1
dir_pin: PC11               # verified correct pin, unsure of !, this matches LDO config
enable_pin: !PD2            # verified correct pin, unsure of !, this matches LDO config
                            # DIAG is PD1
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD0               # verified STEPPER-1 UART
#diag_pin: ^!PD1
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PC9               # verified front-right, Leviathan STEPPER-2
dir_pin: PC8                # verified correct pin, unsure of !, this matches LDO config
enable_pin: !PC10           # verified correct pin, unsure of !, this matches LDO config
                            # DIAG is PA15
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PA8               # verified STEPPER-2 UART
#diag_pin: ^!PA15
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[z_tilt] 
# cannot use bed_tilt because cartographer.cfg has a bed_mesh, so we use z_tilt instead
# Trident 300 standard points
z_positions:
    -50, 18
    150, 348
    350, 18
points:
    30, 5
    150, 245
    270, 5
speed: 200
horizontal_move_z: 5       # safe with Cartographer scan; probe never touches
retries: 5
retry_tolerance: 0.0075

# --------------------------- Bed Heater------------------------------
[heater_bed]
heater_pin: PG11            # verified PWM pin SSR output
sensor_type: Generic 3950
sensor_pin: PA1             # verified TH0 heatbed thermistor
max_power: 0.8              # keep <=0.8 for LDO 300 keenovo-style pad
min_temp: 0
max_temp: 120
control: pid
pid_kp: 40
pid_ki: 1.5
pid_kd: 400                 # run PID_CALIBRATE

# ------------------------ Misc / Temp / Chamber -----------------------
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA2             # verified TH1 chamber thermistor

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor leviathan]
sensor_type: temperature_mcu

[controller_fan electronics_fan]
pin: PB7                          # verified Fan0 PWM
tachometer_pin: ^PB8              # verified Fan0 tach
tachometer_ppr: 2
tachometer_poll_interval: 0.0015
idle_timeout: 30

[fan_generic exhaust_fan]
pin: PB3                          # verified Fan1 PWM
tachometer_pin: ^PB4              # verified Fan1 tach
tachometer_ppr: 2
tachometer_poll_interval: 0.0015
                            
[idle_timeout]
timeout: 1800
gcode:
    # Park active tool safely; don't power off with a tool docked mid-change
    TURN_OFF_HEATERS
    M84

[exclude_object]

[respond]

[save_variables]
# r2pdx offset system + homing macros read/write this file
filename: ~/printer_data/config/klipper-toolchanger/offset_save_file.cfg

[skew_correction] # allows the use of the SET_SKEW, SKEW_PROFILE_SAVE and SKEW_PROFILE_LOAD

[pause_resume]

[input_shaper]
# empty section required so SET_INPUT_SHAPER (per-tool shaper in
# after_change_gcode) works

[force_move]
enable_force_move: true     # handy while commissioning docks

# SAVE_CONFIG section will be appended by Klipper below
