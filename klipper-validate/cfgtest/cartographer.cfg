# =============================================================
# Cartographer 3D probe -- survey (scan) + touch
# Install the plugin first:
#   cd ~ && git clone https://github.com/Cartographer3D/cartographer-klipper
#   ./cartographer-klipper/install.sh
# =============================================================
# TOOLCHANGER NOTE: mount the Cartographer on ONE tool only
# (conventionally T0) or -- better for MadMax -- on the CORE
# carriage itself so it stays present regardless of which tool is
# attached. The MadMax core-mounted approach means Z homing and
# bed meshing work even with no tool picked up. If instead it
# rides on T0, all Z probing macros must first ensure T0 is the
# active tool.

[mcu scanner]
serial: /dev/serial/by-id/usb-Cartographer_614e_...-if00   # <VERIFY>
# canbus_uuid: ...   # if you bought the CAN version

[scanner]
mcu: scanner
x_offset: 0                 # <MEASURE> coil center relative to T0 nozzle
y_offset: 21.0              # <MEASURE>
backlash_comp: 0.005
sensor: cartographer
sensor_alt: carto
mesh_runs: 2
# mode: touch homing uses the nozzle-contact "touch" method;
# scan mode is used for meshes. Calibrate with:
#   CARTOGRAPHER_CALIBRATE  (scan)  then  CARTOGRAPHER_TOUCH

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 30, 30            # keep coil (offsets!) on the plate
mesh_max: 270, 270
probe_count: 25, 25         # scan mode makes dense meshes cheap
algorithm: bicubic
zero_reference_position: 150, 150

# Adaptive meshing is supported natively; add ADAPTIVE=1 to
# BED_MESH_CALIBRATE in PRINT_START.
